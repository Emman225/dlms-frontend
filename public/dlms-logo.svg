<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Cercle de fond avec dégradé -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" opacity="0.1"/>
  
  <!-- Cercle principal -->
  <circle cx="100" cy="100" r="85" fill="url(#gradient2)" opacity="0.95"/>
  
  <!-- Texte DLMS -->
  <text x="100" y="115" font-family="'Inter', 'Arial', sans-serif" font-size="48" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">DLMS</text>
  
  <!-- Petit accent décoratif -->
  <circle cx="100" cy="145" r="3" fill="white" opacity="0.6"/>
  <circle cx="90" cy="145" r="2" fill="white" opacity="0.4"/>
  <circle cx="110" cy="145" r="2" fill="white" opacity="0.4"/>
</svg>
